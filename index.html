<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Română cu Luca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F4F6FB; --paper:#FFFFFF; --ink:#16203A; --muted:#58627E; --line:#DCE1EE; --rule:#E4E9F5; --margin:#F2A7A0;
  --gram:#2B47D1; --gram-soft:#E6EAFC; --lit:#B03A74; --lit-soft:#F8E6EF;
  --xp:#F5B400; --xp-soft:#FFF4CC; --ok:#16935B; --ok-soft:#E1F5EA; --bad:#CF3B2E; --bad-soft:#FBE6E3; --warn:#C97A00;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 6px 20px rgba(22,32,58,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1322; --paper:#171E33; --ink:#E7EBF7; --muted:#9AA4C2; --line:#2A3452; --rule:#222B45; --margin:#7A3B3B;
    --gram:#8A9DFF; --gram-soft:#1E2750; --lit:#F07DB5; --lit-soft:#3A1D2D;
    --xp:#FFCB3D; --xp-soft:#3A3013; --ok:#4CCB8A; --ok-soft:#143325; --bad:#FF7A6B; --bad-soft:#3D1C19; --warn:#FFB547;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1322; --paper:#171E33; --ink:#E7EBF7; --muted:#9AA4C2; --line:#2A3452; --rule:#222B45; --margin:#7A3B3B;
  --gram:#8A9DFF; --gram-soft:#1E2750; --lit:#F07DB5; --lit-soft:#3A1D2D;
  --xp:#FFCB3D; --xp-soft:#3A3013; --ok:#4CCB8A; --ok-soft:#143325; --bad:#FF7A6B; --bad-soft:#3D1C19; --warn:#FFB547;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gram);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--gram);display:inline-block;transform:translateY(-1px);box-shadow:12px 0 0 var(--xp),24px 0 0 var(--lit);margin-right:28px}
.nav{display:flex;gap:4px;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;font-size:15.5px}
.nav a:hover{color:var(--ink);background:var(--paper)}
.nav a.on{color:var(--paper);background:var(--ink)}
.chip-lvl{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;text-decoration:none;color:var(--ink)}
.chip-lvl .lv{width:32px;height:32px;border-radius:50%;background:var(--xp);color:#1b1400;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px}
.chip-lvl .meta{display:flex;flex-direction:column;line-height:1.1;min-width:120px}
.chip-lvl .meta b{font-size:13px}
.chip-lvl .meta small{font-size:11.5px;color:var(--muted)}
.xpbar{height:5px;background:var(--rule);border-radius:9px;margin-top:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);border-radius:9px;transition:width .5s}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}

main{padding-block:24px 64px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.page-h p{margin:.3em 0 0;color:var(--muted);max-width:60ch}
.eyebrow{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--paper);text-decoration:none;transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.gram{background:var(--gram);color:#fff}
.btn.lit{background:var(--lit);color:#fff}
.btn.xp{background:var(--xp);color:#1b1400}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14.5px;border-radius:10px}
:root[data-theme="dark"] .btn.gram,:root[data-theme="dark"] .btn.lit{color:#0E1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.gram,:root:not([data-theme="light"]) .btn.lit{color:#0E1322}}

/* theory */
.theory{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:84px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:calc(100vh - 110px);overflow:auto}
.toc-prog{padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.toc-prog .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.pbar{height:8px;border-radius:9px;background:var(--rule);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:9px;background:var(--accent,var(--gram));transition:width .4s}
.toc a{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.3}
.toc a:hover{background:var(--bg)}
.toc a.on{background:var(--accent-soft,var(--gram-soft));font-weight:700}
.toc .ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.toc .ck.done{background:var(--ok);border-color:var(--ok)}
.toc .ck.done::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.cls{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.lesson{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,36px);box-shadow:var(--shadow)}
.lesson-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.lesson h2{font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.015em;margin-bottom:12px}
.lesson h4{font-size:19px;margin:26px 0 10px;color:var(--accent,var(--gram))}
.lesson p,.lesson li{max-width:70ch}
.lesson .lead{font-size:19px}
.lesson ul,.lesson ol{padding-left:22px}
.lesson li{margin:4px 0}
.tbl-w{overflow-x:auto;margin:10px 0}
.tbl{border-collapse:collapse;width:100%;font-size:15.5px;min-width:460px}
.tbl th{text-align:left;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.def,.trap,.tip{border-radius:12px;padding:12px 16px;margin:12px 0}
.def{background:var(--accent-soft,var(--gram-soft))}
.trap{background:var(--bad-soft);border-left:4px solid var(--bad)}
.tip{background:var(--xp-soft);border-left:4px solid var(--xp)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid2 .def{margin:0}
.lesson-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);margin-top:28px;padding-top:18px}
.lesson-nav{display:flex;gap:8px}
.gram-page{--accent:var(--gram);--accent-soft:var(--gram-soft)}
.lit-page{--accent:var(--lit);--accent-soft:var(--lit-soft)}
.toc-mobile{display:none}

/* tests page */
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative}
.tcard .num{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--gram);letter-spacing:-.03em}
.tcard.done .num{color:var(--ok)}
.tcard h3{font-size:20px}
.tcard .day{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tcard ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--muted)}
.tcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:8px}
.nota{font-family:var(--f-mono);font-weight:700;padding:3px 9px;border-radius:8px;font-size:14px}
.nota.hi{background:var(--ok-soft);color:var(--ok)}
.nota.mid{background:var(--xp-soft);color:var(--warn)}
.nota.lo{background:var(--bad-soft);color:var(--bad)}
.nota.none{background:var(--bg);color:var(--muted)}
.drills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.drill{background:var(--ink);color:var(--paper);border-radius:18px;padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.drill h3{font-size:22px}
.drill p{margin:.2em 0 0;opacity:.75;font-size:15px}
.drill.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.resume{background:var(--xp-soft);border:1px solid var(--xp);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.section-t{font-size:22px;font-weight:800;margin:30px 0 12px}

/* runner */
.run-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--paper);border-bottom:1px solid var(--line)}
.run-top-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.run-title{font-family:var(--f-display);font-weight:800;font-size:18px;flex:1;min-width:160px}
.run-title small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--bg);font-weight:700;font-size:14.5px;border:1px solid var(--line)}
.pill.timer{font-family:var(--f-mono)}
.pill.timer.low{background:var(--xp-soft);color:var(--warn);border-color:var(--xp)}
.pill.timer.crit{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.xp{background:var(--xp-soft);border-color:var(--xp)}
.pill.streak{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.streak.off{background:var(--bg);color:var(--muted)}
.dots{display:flex;gap:3px;padding-bottom:10px}
.dots i{flex:1;height:6px;border-radius:4px;background:var(--rule)}
.dots i.cur{background:var(--ink)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.dots i.part{background:var(--xp)}
.run-body{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding-block:22px 60px}
.run-body.has-text{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.textpane{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;border-radius:16px;border:1px solid var(--line);background:var(--paper)}
.tp-tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.tp-tabs button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 11px;font-weight:700;font-size:14px}
.tp-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notebook{padding:18px 22px 22px 58px;background-image:linear-gradient(to right,transparent 42px,var(--margin) 42px,var(--margin) 44px,transparent 44px),repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule) 29px,var(--rule) 30px);line-height:30px;font-size:17.5px}
.notebook h3{font-size:18px;line-height:30px;margin-bottom:0}
.notebook p{margin:0 0 0}
.notebook .poem p{margin-bottom:30px}
.notebook .src{font-size:13px;color:var(--muted);font-style:italic}
.didas{font-style:italic;color:var(--muted)}
.drama-list{font-size:15.5px}
.poster{border:2px dashed var(--lit);border-radius:12px;padding:16px;text-align:center;line-height:1.35;margin:8px 0 14px;background:var(--paper)}
.poster-k{font-size:14px;color:var(--muted)}
.poster-t{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--lit);margin:6px 0}
.poster-d{font-weight:700}
.poster-s{margin-top:8px;font-weight:700;color:var(--ok)}
.poster-f{margin-top:6px;font-size:14px;color:var(--muted)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.6vw,28px);box-shadow:var(--shadow)}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px;color:var(--muted);font-weight:600}
.tag{padding:2px 9px;border-radius:999px;font-weight:700;font-size:12.5px}
.tag.g{background:var(--gram-soft);color:var(--gram)}
.tag.l{background:var(--lit-soft);color:var(--lit)}
.q-prompt{font-size:20px;font-weight:600;line-height:1.4;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);transition:border-color .12s, background .12s}
.opt:hover:not([disabled]){border-color:var(--gram)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px}
.opt.sel{border-color:var(--gram);background:var(--gram-soft)}
.opt.sel .k{background:var(--gram);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700;font-size:18px}
.fill{width:100%;font:inherit;font-size:19px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.fill:focus{border-color:var(--gram);outline:0}
.fill.right{border-color:var(--ok);background:var(--ok-soft)}
.fill.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea.fill{min-height:180px;resize:vertical;font-size:17px;line-height:1.5}
.wc{font-size:13px;color:var(--muted);margin-top:6px;font-family:var(--f-mono)}
.q-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.fb{margin-top:18px;border-radius:14px;padding:14px 16px;animation:pop .28s ease-out}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.part{background:var(--xp-soft)}
.fb-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-display);font-weight:800;font-size:20px}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb.part .fb-h{color:var(--warn)}
.fb p{margin:6px 0 0}
.fb-theory{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--ink) 20%,transparent);font-size:15px}
.gain{font-family:var(--f-mono);font-size:14px;background:var(--xp);color:#1b1400;border-radius:8px;padding:2px 8px}
.model{background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:14px;white-space:pre-line;font-size:16px;border-left:4px solid var(--ok)}
.rubric{display:grid;gap:8px;margin-top:14px}
.rubric label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);cursor:pointer}
.rubric input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.rubric .p{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.read-note{font-size:14px;color:var(--lit);font-weight:700;margin-bottom:8px}
.show-text{display:none}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.floatxp{position:fixed;z-index:60;font-family:var(--f-mono);font-weight:700;color:#1b1400;background:var(--xp);padding:4px 10px;border-radius:999px;pointer-events:none;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
.confirm{background:var(--xp-soft);border:1px solid var(--xp);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* results */
.res{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.res-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}
.grade{width:190px;height:190px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--rule) 0)}
.grade>div{width:156px;height:156px;border-radius:50%;background:var(--paper);display:grid;place-items:center;align-content:center}
.grade b{font-family:var(--f-display);font-size:54px;font-weight:800;line-height:1}
.grade small{color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15.5px}
.kv span:nth-child(2n){font-family:var(--f-mono);font-weight:700;text-align:right}
.topics{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:170px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:15px}
.trow .bar-t{height:10px;border-radius:9px;background:var(--rule);overflow:hidden}
.trow .bar-t i{display:block;height:100%;border-radius:9px}
.trow .pct{font-family:var(--f-mono);font-size:13.5px;text-align:right}
.miss{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.miss p{margin:0;max-width:62ch}
.miss small{color:var(--muted)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:grid;gap:6px;justify-items:center}
.badge .medal{width:62px;height:62px}

id: "g-fonetica", cls: "V", title: "Fonetica: sunete, silabe, accent", topic: "fonetica",
body: `
<p class="lead">Fonetica studiază <b>sunetele</b> limbii. Sunetul se aude, litera se scrie.</p>
<div class="def"><b>Sunetul</b> = cea mai mică unitate a limbii vorbite. <b>Litera</b> = semnul grafic al sunetului.</div>
<h4>Sunete care nu corespund literelor</h4>
<ul>
<li><b>x</b> = două sunete: [cs] (<i>taxi</i>) sau [gz] (<i>examen</i>).</li>
<li><b>ch, gh</b> (înainte de <i>e, i</i>) = un singur sunet: <i>chem, ghete</i>.</li>
<li><b>ce, ci, ge, gi</b>: dacă după ele urmează altă vocală în aceeași silabă, <i>e</i> și <i>i</i> nu sunt sunete, sunt doar litere: <i>ceas</i> are 4 litere, dar 3 sunete; <i>ghindă</i> are 6 litere, 5 sunete.</li>
<li><b>i final</b> „șoptit” (<i>pomi, lupi</i>) nu formează silabă singur.</li>
</ul>
<h4>Vocale, consoane, semivocale</h4>
<table class="tbl"><tr><th>Categorie</th><th>Ce sunt</th><th>Exemple</th></tr>
<tr><td>Vocale (7)</td><td>pot forma singure o silabă</td><td>a, ă, â/î, e, i, o, u</td></tr>
<tr><td>Semivocale (4)</td><td>seamănă cu vocalele, dar nu pot forma silabă singure</td><td>e, i, o, u în <i>seară, iarnă, oaie, beau</i></td></tr>
<tr><td>Consoane (22)</td><td>se rostesc doar împreună cu o vocală</td><td>b, c, d, f, g, h, j, k, l, m, n, p, r, s, ș, t, ț, v, x, z...</td></tr></table>
<h4>Diftong, triftong, hiat</h4>
<div class="grid2">
<div class="def"><b>Diftong</b> = vocală + semivocală (sau invers) în <u>aceeași silabă</u>.<br><i>sea-ră (ea), cuib (ui), ploa-ie (oa, ie), ca-iet (ie)</i></div>
<div class="def"><b>Triftong</b> = vocală + două semivocale în <u>aceeași silabă</u>.<br><i>le-oai-că (oai), cre-ioa-ne (ioa), beau (eau), iei (iei)</i></div>
</div>
<div class="def"><b>Hiat</b> = două vocale alăturate care fac parte din <u>silabe diferite</u>.<br><i>po-e-zi-e (o-e, i-e), a-er, i-de-e, al-co-ol, ve-ni-a</i></div>
<div class="trap"><b>Capcană!</b> <i>idee</i> are hiat (i-de-e), nu diftong. <i>poezie</i> are două hiaturi. Verifică întotdeauna despărțind în silabe!</div>
<h4>Despărțirea în silabe – reguli</h4>
<table class="tbl"><tr><th>Situația</th><th>Regula</th><th>Exemplu</th></tr>
<tr><td>V – V</td><td>vocalele se despart (hiat)</td><td>a-er, po-e-zi-e</td></tr>
<tr><td>V C V</td><td>consoana trece la silaba următoare</td><td>a-ră, ca-să</td></tr>
<tr><td>V C C V</td><td>prima consoană rămâne, a doua trece</td><td>dul-ce, ar-bo-re</td></tr>
<tr><td>excepție</td><td>b, c, d, f, g, h, p, t, v + <b>l</b> sau <b>r</b> trec împreună</td><td>co-bră, bi-ci-cle-tă, a-fla</td></tr>
<tr><td>V C C C V</td><td>prima consoană rămâne, celelalte trec</td><td>as-tru, mon-stru</td></tr>
<tr><td>excepții</td><td>lpt, mpt, mpț, nct, ncț, ncș, ndv, rct, rtf, stm: primele două rămân</td><td>sculp-tor, punc-tu-al, arc-tic</td></tr></table>
<h4>Accentul</h4>
<p>Accentul = rostirea mai apăsată a unei silabe. Unele cuvinte își schimbă sensul după accent: <i>ácele</i> (de cusut) / <i>acéle</i> (acelea); <i>cópii</i> (reproduceri) / <i>copíi</i> (băieți și fete).</p>
<div class="tip"><b>La EN:</b> vei primi cerințe ca „Precizează numărul de litere și de sunete” sau „Scrie un cuvânt cu diftong / triftong / hiat din text”.</div>
`},

body: `
<p class="lead">Vocabularul = totalitatea cuvintelor unei limbi. Un cuvânt are formă (sunete) și sens (înțeles).</p>
<h4>Sensul cuvintelor</h4>
<div class="grid2">
<div class="def"><b>Sens propriu</b> (de bază): primul înțeles, cel din dicționar.<br><i>Pisica prinde șoarecele.</i></div>
<div class="def"><b>Sens figurat</b>: sens nou, neobișnuit, apare în context, de obicei în literatură.<br><i>Lucrurile vechi prind viață. Are o inimă de aur.</i></div>
</div>
<h4>Relații între cuvinte</h4>
<table class="tbl"><tr><th>Termen</th><th>Ce înseamnă</th><th>Exemple</th></tr>
<tr><td><b>Sinonime</b></td><td>formă diferită, sens asemănător</td><td>limpede = clar; a zice = a spune</td></tr>
<tr><td><b>Antonime</b></td><td>sens opus</td><td>vechi ≠ nou; harnic ≠ leneș; a urca ≠ a coborî</td></tr>
<tr><td><b>Omonime</b></td><td>aceeași formă, sensuri total diferite</td><td>broască (animal) / broască (de ușă); lac (apă) / lac (de unghii)</td></tr>
<tr><td><b>Paronime</b></td><td>formă aproape la fel, sens diferit – se confundă ușor!</td><td>original / originar; eminent / iminent; a enerva / a inerva; familiar / familial</td></tr>
<tr><td><b>Cuvinte polisemantice</b></td><td>un cuvânt cu mai multe sensuri înrudite</td><td>cap (al omului, al listei, capul străzii)</td></tr></table>
<div class="trap"><b>Capcană!</b> Omonimele au sensuri <u>fără legătură</u>; cuvântul polisemantic are sensuri <u>înrudite</u>.</div>
<h4>Pleonasmul (greșeală de exprimare)</h4>
<p>Pleonasmul = repetarea inutilă a aceleiași idei: <s>a urca sus</s>, <s>a coborî jos</s>, <s>a reveni din nou</s>, <s>mai mult ca sigur</s> → corect: <i>a urca, a coborî, a reveni, sigur</i>.</p>
<h4>Familia lexicală și câmpul lexical</h4>
<div class="grid2">
<div class="def"><b>Familia lexicală</b> = cuvântul de bază + toate cuvintele formate din el.<br><i>floare → floricică, florar, înflori, înflorit, florărie</i></div>
<div class="def"><b>Câmpul lexical</b> = cuvinte din aceeași temă (nu neapărat înrudite).<br><i>școala: elev, tablă, catalog, profesor, bancă</i></div>
</div>
<h4>Formarea cuvintelor</h4>
<table class="tbl"><tr><th>Mijloc</th><th>Cum</th><th>Exemple</th></tr>
<tr><td><b>Derivarea cu sufixe</b></td><td>se adaugă la sfârșit</td><td>bicicletă → biciclet<b>ist</b>; carte → cărț<b>ulie</b>; pom → pom<b>ișor</b> (diminutiv)</td></tr>
<tr><td><b>Derivarea cu prefixe</b></td><td>se adaugă la început</td><td><b>re</b>scrie, <b>ne</b>atent, <b>în</b>flori, <b>des</b>face</td></tr>
<tr><td><b>Compunerea</b></td><td>se unesc două sau mai multe cuvinte</td><td>floarea-soarelui, untdelemn, bunăvoință, Câmpulung</td></tr>
<tr><td><b>Conversiunea</b></td><td>cuvântul trece la altă parte de vorbire</td><td><i>Binele</i> învinge. (adverb → substantiv)</td></tr></table>
<div class="tip"><b>La EN:</b> „Scrie un sinonim / antonim potrivit contextului”, „Construiește un enunț în care cuvântul să aibă sens figurat”, „Scrie un cuvânt format prin derivare”.</div>
`},

id: "g-verb-ind", cls: "V", title: "Verbul I: indicativul și timpurile", topic: "verb",
body: `
<p class="lead">Verbul = partea de vorbire flexibilă care arată <b>acțiunea</b> (a alerga), <b>starea</b> (a sta, a dormi) sau <b>existența</b> (a fi, a exista).</p>
<h4>Categorii gramaticale</h4>
<ul><li><b>Persoana</b>: I (eu, noi), a II-a (tu, voi), a III-a (el, ea, ei, ele).</li>
<li><b>Numărul</b>: singular / plural.</li>
<li><b>Modul</b> și <b>timpul</b>.</li></ul>
<h4>Verbe predicative și nepredicative</h4>
<table class="tbl"><tr><th>Tip</th><th>Explicație</th><th>Exemplu</th></tr>
<tr><td><b>Predicativ</b></td><td>are sens de sine stătător, formează singur predicatul verbal</td><td>Luca <u>citește</u>. <u>Am</u> o bicicletă.</td></tr>
<tr><td><b>Auxiliar</b></td><td>ajută la formarea unor timpuri/moduri: <b>a avea, a fi, a vrea</b></td><td><u>am</u> citit, <u>voi</u> citi, <u>aș</u> citi, să <u>fi</u> citit</td></tr>
<tr><td><b>Copulativ</b></td><td>leagă subiectul de numele predicativ (cl. a VI-a): <b>a fi</b>, a deveni</td><td>Cerul <u>este</u> senin.</td></tr></table>
<div class="trap"><b>Capcană!</b> <i>„Am o carte”</i> – <b>am</b> = predicativ (= a poseda). <i>„Am citit o carte”</i> – <b>am</b> = auxiliar. Același verb poate avea roluri diferite!</div>
<h4>Modul indicativ – timpurile (exemplu: a cânta)</h4>
<table class="tbl"><tr><th>Timp</th><th>Ce arată</th><th>Pers. I sg.</th><th>Pers. a III-a sg.</th></tr>
<tr><td><b>Prezent</b></td><td>acum</td><td>cânt</td><td>cântă</td></tr>
<tr><td><b>Imperfect</b></td><td>trecut neterminat, de durată</td><td>cântam</td><td>cânta</td></tr>
<tr><td><b>Perfect compus</b></td><td>trecut încheiat (auxiliar a avea + participiu)</td><td>am cântat</td><td>a cântat</td></tr>
<tr><td><b>Perfect simplu</b></td><td>trecut foarte apropiat, frecvent în povești</td><td>cântai</td><td>cântă</td></tr>
<tr><td><b>Mai-mult-ca-perfectul</b></td><td>acțiune încheiată înaintea altei acțiuni trecute</td><td>cântasem</td><td>cântase</td></tr>
<tr><td><b>Viitor</b></td><td>după momentul vorbirii</td><td>voi cânta / o să cânt</td><td>va cânta</td></tr></table>
<div class="tip"><b>Truc de recunoaștere:</b> <i>-sem, -seși, -se, -serăm</i> = mai-mult-ca-perfect; <i>-am, -ai, -a, -au</i> fără auxiliar = imperfect (râdea, mergeam); <i>zise, râse, plecă</i> = perfect simplu.</div>
<div class="trap"><b>Atenție la persoana a III-a:</b> „el <b>cântă</b>” poate fi prezent sau perfect simplu. Contextul decide: „Ieri cântă frumos” → perfect simplu.</div>
`},

id: "g-verb-moduri", cls: "VI", title: "Verbul II: celelalte moduri", topic: "verb",
body: `
<p class="lead">Modurile arată <b>cum</b> privește vorbitorul acțiunea: reală, posibilă, dorită, poruncită.</p>
<h4>Moduri personale (au persoană, pot fi predicat)</h4>
<table class="tbl"><tr><th>Mod</th><th>Ce exprimă</th><th>Formare</th><th>Exemple</th></tr>
<tr><td><b>Indicativ</b></td><td>acțiune reală, sigură</td><td>vezi capitolul anterior</td><td>cânt, am cântat</td></tr>
<tr><td><b>Conjunctiv</b></td><td>acțiune posibilă, dorită</td><td><b>să</b> + verb</td><td>prezent: <i>să cânt, să râdă</i>; perfect: <i>să fi cântat</i></td></tr>
<tr><td><b>Condițional-optativ</b></td><td>acțiune dorită sau condiționată</td><td><b>aș, ai, ar, am, ați, ar</b> + infinitiv</td><td>prezent: <i>aș cânta</i>; perfect: <i>aș fi cântat</i></td></tr>
<tr><td><b>Imperativ</b></td><td>poruncă, rugăminte, îndemn (doar pers. a II-a)</td><td>afirmativ / negativ</td><td><i>Cântă! Adu-l! Veniți!</i> / <i>Nu cânta! Nu aduce!</i></td></tr></table>
<div class="trap"><b>Imperativul negativ</b> la singular = <b>nu + infinitivul fără „a”</b>: <i>nu fugi, nu scrie, nu lua</i>. La imperativ, verbul e urmat de semnul exclamării sau de virgulă.</div>
<h4>Moduri nepersonale (NU au persoană)</h4>
<table class="tbl"><tr><th>Mod</th><th>Mărci</th><th>Exemple</th></tr>
<tr><td><b>Infinitiv</b></td><td>„a” + verb</td><td>a cânta, a merge, a fi</td></tr>
<tr><td><b>Gerunziu</b></td><td>-ând, -ind</td><td>cântând, șoptind, zâmbind</td></tr>
<tr><td><b>Participiu</b></td><td>-t, -s (ca un adjectiv)</td><td>cântat, decorat, scris, ars</td></tr>
<tr><td><b>Supin</b></td><td>de, la, pentru + participiu</td><td>de cântat, de citit, la scris, pentru alergat</td></tr></table>
<div class="trap"><b>Participiu sau supin?</b> „tortul <u>decorat</u>” → participiu (arată o însușire). „Am de <u>decorat</u> tortul” → supin (are prepoziție înainte și arată acțiunea).</div>
<div class="tip"><b>Rețeta de identificare:</b> caută mai întâi mărcile: <b>să</b> → conjunctiv; <b>aș/ar</b> → condițional; <b>!</b> fără persoană exprimată → imperativ; <b>a</b> → infinitiv; <b>-ând/-ind</b> → gerunziu.</div>
`},
{
id: "g-substantiv", cls: "V–VI", title: "Substantivul și cazurile", topic: "substantiv",
body: `
<p class="lead">Substantivul = partea de vorbire flexibilă care denumește <b>ființe, lucruri, fenomene, însușiri, acțiuni</b>.</p>
<h4>Felul</h4>
<ul><li><b>Comune</b>: denumesc obiecte de același fel: <i>copil, oraș, râu</i>.</li>
<li><b>Proprii</b>: denumesc un singur obiect, se scriu cu majusculă: <i>Luca, București, Dunărea, Marea Neagră</i>.</li></ul>
<h4>Genul – testul „un / două”</h4>
<table class="tbl"><tr><th>Gen</th><th>Test</th><th>Exemple</th></tr>
<tr><td>Masculin</td><td>un ... / doi ...</td><td>un munte – doi munți</td></tr>
<tr><td>Feminin</td><td>o ... / două ...</td><td>o frunză – două frunze</td></tr>
<tr><td>Neutru</td><td>un ... / două ...</td><td>un acoperiș – două acoperișuri; un scaun – două scaune</td></tr></table>
<h4>Numărul</h4>
<p>Singular / plural. Unele au doar singular (<i>aur, miere, curaj</i>), altele doar plural (<i>ochelari, tăiței, câlți</i>).</p>
<h4>Cazurile (cl. a V-a: N, Ac; cl. a VI-a: G, D, V)</h4>
<table class="tbl"><tr><th>Caz</th><th>Întrebări</th><th>Funcții sintactice</th><th>Exemplu</th></tr>
<tr><td><b>Nominativ</b></td><td>cine? ce?</td><td>subiect, nume predicativ</td><td><u>Toamna</u> trece. Ea este <u>profesoară</u>.</td></tr>
<tr><td><b>Acuzativ</b></td><td>pe cine? ce? cu cine? unde? (+ prepoziții: <i>cu, de, la, în, pe, prin, pentru, despre, sub</i>)</td><td>complement direct, indirect, circumstanțial, atribut prepozițional</td><td>Citesc o <u>carte</u>. Trec prin <u>livadă</u>.</td></tr>
<tr><td><b>Genitiv</b></td><td>al cui? a cui? ai cui? ale cui?</td><td>atribut substantival genitival</td><td>culoarea <u>frunzelor</u>, fântâna <u>zmeului</u></td></tr>
<tr><td><b>Dativ</b></td><td>cui?</td><td>complement indirect</td><td>Toamna le dăruiește <u>copiilor</u> mere.</td></tr>
<tr><td><b>Vocativ</b></td><td>– (adresare)</td><td>nu are funcție sintactică; se desparte prin virgulă sau !</td><td><u>Toamnă</u>, rămâi! Încet, <u>copii</u>!</td></tr></table>
<div class="trap"><b>Capcană G/D:</b> formele sunt identice (<i>copilului, livezii</i>). Pune întrebarea: „al cui?” → Genitiv; „cui?” → Dativ. <i>Cartea <u>copilului</u></i> (G) / <i>I-am dat <u>copilului</u> o carte</i> (D).</div>
<div class="tip"><b>Genitivul singular articulat</b> pentru feminine: <i>livadă → livezii, frunză → frunzei, carte → cărții, mamă → mamei</i>.</div>
`},

<p class="lead">Articolul = partea de vorbire flexibilă care însoțește substantivul și arată cât de cunoscut este obiectul.</p>
<table class="tbl"><tr><th>Tip</th><th>Forme</th><th>Exemple</th></tr>
<tr><td><b>Hotărât</b> (lipit la sfârșit)</td><td>-l, -le, -ul, -a, -i, -le, -lui, -ei, -lor</td><td>băiat<b>ul</b>, mere<b>le</b>, toamn<b>a</b>, copii<b>lor</b></td></tr>
<tr><td><b>Nehotărât</b> (în fața substantivului)</td><td>un, o, niște, unui, unei, unor</td><td><b>un</b> măr, <b>o</b> mantie, <b>niște</b> frunze</td></tr>

{
id: "g-pronume", cls: "V–VI", title: "Pronumele", topic: "pronume",
body: `
<p class="lead">Pronumele = partea de vorbire flexibilă care <b>ține locul unui substantiv</b>.</p>
<h4>Pronumele personal</h4>
<table class="tbl"><tr><th>Persoana</th><th>Singular</th><th>Plural</th><th>Forme neaccentuate</th></tr>
<tr><td>I</td><td>eu</td><td>noi</td><td>mă, m-, mi, îmi, ne, ni</td></tr>
<tr><td>a II-a</td><td>tu</td><td>voi</td><td>te, îți, ți, vă, vi</td></tr>
<tr><td>a III-a</td><td>el, ea</td><td>ei, ele</td><td>îl, l-, o, îi, i-, le, li</td></tr></table>
<p><i>Mihai <u>îi</u> spune Anei. Adu-<u>l</u>!</i> – <b>îi</b> și <b>-l</b> sunt pronume personale.</p>
<h4>Pronumele de politețe</h4>
<p><i>dumneata, dumneavoastră, dânsul, dânsa, dânșii, Domnia Sa, Domnia Voastră, Maiestatea Sa</i> – arată respect față de persoana despre care se vorbește sau căreia i se vorbește.</p>
<h4>Pronumele reflexiv (cl. a VI-a)</h4>
<p>Arată că acțiunea se răsfrânge asupra celui care o face: <b>se, își, sie, sine</b> (pers. a III-a); pentru pers. I și a II-a formele sunt ca la personal (<i>mă spăl, te pieptăni</i>). <i>Melcul nu <u>se</u> supără. Radu <u>și</u>-a luat bicicleta.</i></p>
<h4>Pronumele posesiv (cl. a VI-a)</h4>
<p>Arată cui aparține obiectul și ține locul și posesorului, și obiectului: <b>al meu, a ta, ai săi, ale noastre, al vostru</b>. <i>Drumul meu e lung, <u>al tău</u> e scurt.</i></p>
<h4>Pronumele demonstrativ (cl. a VI-a)</h4>
<p>Arată apropierea sau depărtarea: <b>acesta, aceasta, aceștia, acestea</b> (apropiere); <b>acela, aceea, aceia, acelea</b> (depărtare); <b>același, aceeași</b> (identitate); <b>celălalt, cealaltă</b> (diferențiere). <i><u>Acesta</u> e melcul.</i></p>
<div class="trap"><b>Pronume sau adjectiv pronominal?</b> Dacă stă <u>singur</u> în locul substantivului → pronume (<i>Acesta e al meu</i>). Dacă <u>însoțește</u> un substantiv → adjectiv pronominal (<i>băiatul acesta, cartea mea</i>).</div>
`},
{
id: "g-adjectiv", cls: "V–VI", title: "Adjectivul și gradele de comparație", topic: "adjectiv",
body: `
<p class="lead">Adjectivul = partea de vorbire flexibilă care arată <b>însușirea</b> unui obiect. Se acordă în gen, număr și caz cu substantivul.</p>
<p><i>frunz<b>e</b> aurat<b>e</b>, mantie mătăs<b>oasă</b>, cal năzdrăvan</i> – funcție sintactică: <b>atribut adjectival</b> (sau <b>nume predicativ</b> după „a fi”: <i>Calul era <u>năzdrăvan</u></i>).</p>
<h4>Gradele de comparație</h4>
<table class="tbl"><tr><th>Grad</th><th>Formare</th><th>Exemplu</th></tr>
<tr><td>Pozitiv</td><td>forma de bază</td><td>frumos</td></tr>
<tr><td>Comparativ de superioritate</td><td>mai + adj.</td><td>mai frumos</td></tr>
<tr><td>Comparativ de egalitate</td><td>la fel de / tot atât de + adj.</td><td>la fel de frumos</td></tr>
<tr><td>Comparativ de inferioritate</td><td>mai puțin + adj.</td><td>mai puțin frumos</td></tr>
<tr><td>Superlativ relativ</td><td>cel mai / cel mai puțin + adj.</td><td>cel mai frumos (din clasă)</td></tr>
<tr><td>Superlativ absolut</td><td>foarte, extrem de, tare, nemaipomenit de + adj.</td><td>foarte frumos, extrem de roșu</td></tr></table>
<div class="trap"><b>Adjective fără grade de comparație:</b> <i>unic, perfect, veșnic, principal, maxim, minim, desăvârșit, complet, mort, viu</i>. Nu spunem „<s>cel mai unic</s>”.</div>
`},

id: "g-numeral", cls: "V–VI", title: "Numeralul", topic: "numeral",

<p class="lead">Numeralul = partea de vorbire care exprimă un <b>număr</b>, <b>ordinea</b> sau o <b>determinare numerică</b>.</p>
<table class="tbl"><tr><th>Tip</th><th>Ce arată</th><th>Exemple</th></tr>
<tr><td><b>Cardinal</b></td><td>numărul</td><td>unu, doi, trei, zece, douăzeci</td></tr>
<tr><td><b>Ordinal</b></td><td>ordinea</td><td>primul, întâiul, al doilea, a doua, al treilea</td></tr>
<tr><td><b>Colectiv</b></td><td>un grup</td><td>amândoi, ambii, ambele, tustrei, toți trei</td></tr>
<tr><td><b>Multiplicativ</b></td><td>de câte ori crește</td><td>dublu, triplu, îndoit, întreit, înzecit</td></tr>
<tr><td><b>Fracționar</b></td><td>o parte dintr-un întreg</td><td>o doime, o treime, jumătate, sfert, trei pătrimi</td></tr>
<tr><td><b>Distributiv</b></td><td>repartizarea</td><td>câte unul, câte doi</td></tr>
<tr><td><b>Adverbial</b></td><td>de câte ori se face o acțiune</td><td>o dată, de două ori, a treia oară</td></tr></table>
<div class="trap"><b>odată</b> (adverb = cândva: <i>A fost odată</i>) ≠ <b>o dată</b> (numeral adverbial = o singură dată: <i>Am citit-o o dată</i>).</div>
<div class="tip">Scriere: <b>al doilea, a doua</b> (nu „<s>a doilea</s>”); <b>doisprezece</b> (m.) / <b>douăsprezece</b> (f.); <b>paisprezece, șaisprezece</b>.</div>

{
id: "g-neflexibile", cls: "V–VI", title: "Adverbul, prepoziția, conjuncția, interjecția", topic: "neflexibile",
body: `
<p class="lead">Aceste părți de vorbire sunt <b>neflexibile</b>: nu își schimbă forma.</p>
<h4>Adverbul</h4>
<p>Arată <b>locul, timpul sau modul</b> unei acțiuni; determină un verb (uneori un adjectiv).</p>
<table class="tbl"><tr><th>Fel</th><th>Întrebare</th><th>Exemple</th></tr>
<tr><td>de loc</td><td>unde?</td><td>aici, acolo, sus, jos, departe</td></tr>
<tr><td>de timp</td><td>când?</td><td>azi, mâine, acum, seara, mereu, încă</td></tr>
<tr><td>de mod</td><td>cum?</td><td>bine, repede, încet, astfel, limpede</td></tr></table>
<p>Adverbele de mod au grade de comparație: <i>repede – mai repede – cel mai repede – foarte repede</i>. Funcție: complement circumstanțial.</p>
<h4>Prepoziția</h4>
<p>Leagă un cuvânt de altul; nu are funcție sintactică singură.</p>
<ul><li>Simple: <i>de, la, în, cu, pe, prin, pentru, despre, fără, sub, lângă</i></li>
<li>Compuse: <i>de la, de pe, pe la, de lângă, de sub, dinspre, până la</i></li>
<li>Locuțiuni: <i>în fața, de-a lungul, în loc de, din cauza</i></li></ul>
<table class="tbl"><tr><th>Cer cazul</th><th>Prepoziții</th></tr>
<tr><td>Acuzativ</td><td>cele mai multe: cu, de, la, în, pe, prin, pentru, despre</td></tr>
<tr><td>Genitiv</td><td>asupra, contra, împotriva, deasupra, înaintea, în fața, din cauza</td></tr>
<tr><td>Dativ</td><td>datorită, mulțumită, grație, conform, potrivit, contrar, aidoma</td></tr></table>
<h4>Conjuncția</h4>
<p>Leagă două cuvinte sau două propoziții.</p>
<ul><li><b>Coordonatoare</b>: <i>și, nici, iar, dar, însă, ci, sau, ori</i> – leagă elemente egale.</li>
<li><b>Subordonatoare</b>: <i>că, să, dacă, ca...să, deși, încât</i> – leagă o propoziție secundară de regentă.</li></ul>
<div class="trap"><b>Virgula</b> se pune înainte de <i>dar, iar, însă, ci</i>, dar <u>nu</u> înainte de <i>și</i> (cu excepții).</div>
<h4>Interjecția</h4>
<p>Exprimă <b>stări sufletești</b> (<i>vai, of, ah, oh, bravo</i>), <b>îndemnuri</b> (<i>hai, na, iată</i>) sau <b>imită sunete</b> – onomatopee (<i>cucu, miau, poc, trosc, pleosc</i>). Se desparte prin virgulă sau semnul exclamării: <i>Vai, ce încet mergi!</i></p>
`},
{
id: "g-sintaxa", cls: "V–VI", title: "Sintaxa propoziției", topic: "sintaxa",
body: `
<p class="lead">Propoziția = comunicare cu <b>un singur predicat</b>. <b>Simplă</b>: doar subiect + predicat (<i>Ilie pleacă.</i>). <b>Dezvoltată</b>: are și părți secundare (<i>Ilie pleacă repede la drum.</i>).</p>
<h4>Părțile principale</h4>
<table class="tbl"><tr><th>Parte</th><th>Întrebare</th><th>Tipuri și exemple</th></tr>
<tr><td><b>Predicatul verbal</b></td><td>ce face? ce se întâmplă?</td><td>verb predicativ la mod personal: <i>Mezinul <u>a pornit</u> la drum.</i></td></tr>
<tr><td><b>Predicatul nominal</b> (cl. VI)</td><td>ce este? cum este?</td><td>verb copulativ + nume predicativ: <i>Calul <u>era năzdrăvan</u>. Cerul <u>este senin</u>.</i></td></tr>
<tr><td><b>Subiectul</b></td><td>cine? ce? (pus înaintea predicatului)</td><td>exprimat: <i><u>Ilie</u> pleacă.</i> / multiplu: <i><u>Ilie și calul</u> au ajuns.</i></td></tr></table>
<h4>Subiectul neexprimat</h4>
<div class="grid2">
<div class="def"><b>Inclus</b>: se înțelege din terminația verbului (pers. I și a II-a).<br><i>Plec mâine.</i> → (eu). <i>Citești?</i> → (tu)</div>
<div class="def"><b>Subînțeles</b>: se deduce din propoziția anterioară (pers. a III-a).<br><i>Feciorii au păzit. <u>Au adormit</u>.</i> → (feciorii)</div>
</div>
<h4>Părțile secundare</h4>
<table class="tbl"><tr><th>Parte</th><th>Determină</th><th>Exemple</th></tr>
<tr><td><b>Atribut adjectival</b></td><td>un substantiv</td><td>cal <u>năzdrăvan</u>, frunze <u>aurate</u>, <u>trei</u> feciori</td></tr>
<tr><td><b>Atribut substantival</b></td><td>un substantiv</td><td>genitival: fântâna <u>zmeului</u>; prepozițional: casa <u>de lemn</u></td></tr>
<tr><td><b>Atribut pronominal</b></td><td>un substantiv</td><td>prietenul <u>lui</u>, cartea <u>ei</u></td></tr>
<tr><td><b>Complement direct</b></td><td>un verb; pe cine? ce?</td><td>Citesc <u>o carte</u>. L-a învins <u>pe zmeu</u>.</td></tr>
<tr><td><b>Complement indirect</b></td><td>un verb; cui? despre cine? cu cine?</td><td>I-a dat <u>calului</u> apă. Vorbește <u>despre basm</u>.</td></tr>
<tr><td><b>C. circumstanțial de loc</b></td><td>unde? de unde? până unde?</td><td>A ajuns <u>la fântână</u>.</td></tr>
<tr><td><b>C. circumstanțial de timp</b></td><td>când? de când? cât timp?</td><td><u>După trei zile</u> a ajuns. Vine <u>mâine</u>.</td></tr>
<tr><td><b>C. circumstanțial de mod</b></td><td>cum?</td><td>A alergat <u>repede</u>.</td></tr></table>
<div class="trap"><b>Nu pune niciodată virgulă între subiect și predicat!</b> <s>Ilie, a plecat.</s> → <i>Ilie a plecat.</i> Excepție: când între ele stă o construcție incidentă sau o apoziție.</div>
`},
{
id: "g-fraza", cls: "V–VI", title: "Fraza, ortografia și punctuația", topic: "fraza",
body: `
<p class="lead">Fraza = comunicare cu <b>două sau mai multe predicate</b>. <b>Câte predicate, atâtea propoziții.</b></p>
<h4>Cum analizezi o frază</h4>
<ol><li>Subliniază toate verbele la moduri personale (predicatele).</li>
<li>Numără-le → numărul de propoziții.</li>
<li>Delimitează propozițiile (de obicei la conjuncții sau virgule).</li></ol>
<h4>Relațiile dintre propoziții</h4>
<div class="grid2">
<div class="def"><b>Coordonare</b>: propoziții egale ca importanță, legate prin <i>și, dar, iar, sau, ci, însă</i> sau prin virgulă (juxtapunere).<br><i>Au plecat pe rând, / dar s-au întors cu mâinile goale.</i></div>
<div class="def"><b>Subordonare</b>: o propoziție (secundară) depinde de alta (regentă), legată prin <i>că, să, dacă, care, când, unde, cum</i>.<br><i>Împăratul știa / că numai apa vie îl putea vindeca.</i></div>
</div>
<p><b>Propoziția principală</b> are sens de sine stătător; <b>propoziția secundară</b> depinde de alta.</p>
<h4>Ortograme (scrieri cu și fără cratimă)</h4>
<table class="tbl"><tr><th>Cu cratimă</th><th>Fără cratimă</th></tr>
<tr><td><b>s-a</b> (se + a): <i>Radu s-a oprit.</i></td><td><b>sa</b> (a lui): <i>cartea sa</i></td></tr>
<tr><td><b>s-au</b> (se + au): <i>S-au jucat.</i></td><td><b>sau</b> (conjuncție = ori): <i>tu sau eu</i></td></tr>
<tr><td><b>i-a</b> (îi + a): <i>Bunicul i-a dat...</i></td><td><b>ia</b> (verbul a lua): <i>Ia cartea!</i></td></tr>
<tr><td><b>l-a</b> (îl + a): <i>L-a învins.</i></td><td><b>la</b> (prepoziție): <i>la fântână</i></td></tr>

<p>A fost odată ca niciodată, într-o împărăție de peste nouă mări și nouă țări, un împărat bătrân care avea trei feciori. Într-o zi, împăratul s-a îmbolnăvit, și numai apa vie din fântâna zmeului îl putea vindeca.</p>
<p>Feciorii cei mari au plecat pe rând, dar s-au întors cu mâinile goale. Mezinul, Ilie, a pornit la drum cu un cal năzdrăvan, care vorbea cu grai omenesc. Calul era înțelept și îi dădea sfaturi bune.</p>
<p>După trei zile și trei nopți, au ajuns la fântână. Ilie l-a învins pe zmeu cu ajutorul calului și s-a întors cu apa cea vie. Împăratul s-a vindecat, iar Ilie a fost răsplătit cu jumătate de împărăție.</p>

/* ---------- XP / levels ---------- */
function levelOf(xp){

  const cur = LEVELS[i][0], next = LEVELS[i+1] ? LEVELS[i+1][0] : null;

}

/* ---------- sound & fx ---------- */
let AC = null;
function tone(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind === "ok" ? [[660,.0],[880,.09]] : kind === "bad" ? [[240,0],[190,.12]] : kind === "level" ? [[523,0],[659,.1],[784,.2],[1046,.3]] : [[523,0],[784,.12],[1046,.24]];
    seq.forEach(([f,t]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, AC.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.18, AC.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + t + .22);
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .25);
    });
  }catch(e){}
}
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n, x, y){
  if(reduce) return;
  const cv = $("#fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ["#2B47D1","#B03A74","#F5B400","#16935B","#CF3B2E"];
  x = x ?? innerWidth/2; y = y ?? innerHeight/3;
  const P = Array.from({length:n}, () => ({x, y, vx:(Math.random()-.5)*12, vy:Math.random()*-11-3, r:Math.random()*6+4, c:pick(cols), a:Math.random()*6, s:(Math.random()-.5)*.4, life:0}));
  let f = 0;
  (function step(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(++f < 110) requestAnimationFrame(step); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

  const r = el ? el.getBoundingClientRect() : {left:innerWidth/2,width:0,top:innerHeight/2};
  const d = document.createElement("div"); d.className = "floatxp"; d.textContent = text;
  d.style.left = (r.left + r.width/2) + "px"; d.style.top = (r.top - 10) + "px";

  let order, title, sub, minutes, tid = null;
  if(mode === "test"){
    const t = TESTS.find(x => x.id === id); tid = t.id;
    order = t.questions.map(q => q.id); title = "Test " + t.num + " · " + t.title; sub = "Evaluare Națională · simulare"; minutes = 45;
  } else if(mode === "fulger"){
    const pool = Object.values(QIDX).filter(o => o.q.type !== "open").map(o => o.q.id);
    order = shuffle(pool).slice(0, 10); title = "Antrenament fulger"; sub = "10 întrebări din toată materia"; minutes = 10;
  } else if(mode === "mix"){
    const auto = shuffle(Object.values(QIDX).filter(o => o.q.type !== "open").map(o => o.q.id));
    const g = auto.filter(q => TOPIC[QIDX[q].q.topic][1] === "g").slice(0, 13);
    const l = auto.filter(q => TOPIC[QIDX[q].q.topic][1] === "l").slice(0, 7);
    const opens = shuffle(Object.values(QIDX).filter(o => o.q.type === "open"));
    const shortOpen = opens.find(o => o.q.pts <= 6), longOpen = opens.find(o => o.q.pts > 6);
    order = shuffle(g.concat(l)).concat([shortOpen.q.id, longOpen.q.id]);
    title = "Test EN amestecat"; sub = "Toată materia · 45 de minute"; minutes = 45;
  } else if(mode === "practice"){
    const pool = Object.values(QIDX).filter(o => o.q.ref === id && o.q.type !== "open").map(o => o.q.id);
    order = shuffle(pool).slice(0, 8); title = "Exersare · " + CHAPTERS[id].title; sub = "Întrebări din acest capitol"; minutes = 0;
  }
  S.run = {id: "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), mode, tid, ref: mode==="practice"?id:null, title, sub, order, idx:0, answers:{}, startedAt: Date.now(), deadline: minutes ? Date.now() + minutes*60000 : null, xp:0, streak:0, maxStreak:0, active:true, textTab:null, skipped:{}, perm:{}};
  order.forEach(qid => { const q = QIDX[qid].q; if(q.type === "mc" || q.type === "multi") S.run.perm[qid] = shuffle(q.options.map((_,i) => i)); });
  LS.set("ro-run", S.run);

}

    }

  }
  return "";
}
function actions(q, a){
  const R = S.run;
  const last = Object.keys(R.answers).length === R.order.length;
  if(a) return `<span></span><button class="btn" data-act="next">${last ? "Vezi rezultatul →" : "Următoarea →"}</button>`;
  const canSkip = !R.skipped[q.id] && R.idx < R.order.length - 1;
  const skip = canSkip ? `<button class="btn ghost sm" data-act="skip">Sari, revin mai târziu</button>` : "<span></span>";
  if(q.type === "open"){
    if(R.phase === "rubric"){
      const pts = (R.rub||[]).reduce((s,i) => s + q.rubric[i].p, 0);
      return `<span></span><button class="btn gram" data-act="rubok">Confirmă punctajul: ${pts} / ${q.pts} p</button>`;
    }
    return `${skip}<button class="btn gram" data-act="model">Am terminat · vezi modelul</button>`;
  }
  const has = q.type === "multi" ? (Array.isArray(R.sel) && R.sel.length) : q.type === "fill" ? true : R.sel !== undefined && R.sel !== null;
  return `${skip}<button class="btn gram" data-act="check" id="checkbtn" ${has?"":"disabled"}>Verifică</button>`;
}
function feedback(q, a){
  const c = CHAPTERS[q.ref];
  const cls = a.correct ? "ok" : a.earned > 0 ? "part" : "bad";
  const head = q.type === "open" ? (a.earned === q.pts ? "Punctaj maxim!" : a.earned > 0 ? "Bun început!" : "Recitește teoria și încearcă din nou data viitoare") : a.correct ? a.praise : a.earned > 0 ? "Parțial corect" : a.praise;
  return `<div class="fb ${cls}">

    <p>${esc(q.expl)}</p>
    ${c ? `<div class="fb-theory"><span>Din teorie: <b>${esc(c.title)}</b> <span class="cls">cl. ${esc(c.cls)}</span></span><button class="btn ghost sm" data-act="lesson" data-id="${c.id}">Deschide lecția</button></div>` : ""}
  </div>`;

function grade(q){
  const R = S.run; let given = R.sel, correct = false, earned = 0;
  if(q.type === "mc"){ correct = given === q.answer; earned = correct ? q.pts : 0; }
  else if(q.type === "tf"){ correct = given === q.answer; earned = correct ? q.pts : 0; }
  else if(q.type === "fill"){ given = ($("#fillin") || {}).value || ""; correct = q.accept.some(x => norm(x) === norm(given)); earned = correct ? q.pts : 0; }
  else if(q.type === "multi"){
    given = (given||[]).slice().sort();
    const hits = given.filter(i => q.answer.includes(i)).length, falses = given.length - hits;
    correct = hits === q.answer.length && falses === 0;
    earned = correct ? q.pts : Math.max(0, Math.round(q.pts * (hits - falses) / q.answer.length));
  }
  return {given, correct, earned};
}
function commitAnswer(q, res, btn){
  const R = S.run;
  let xp = 0, bonus = 0;
  if(q.type === "open"){
    xp = res.earned * 3;
    if(res.earned === q.pts && q.pts >= 12 && grant("scriitor")) R.newBadges = (R.newBadges||[]).concat("scriitor");
  } else if(res.correct){
    R.streak++; R.maxStreak = Math.max(R.maxStreak, R.streak);
    xp = 10; if(R.streak >= 3){ bonus = 5; }
    if(R.streak >= 5 && grant("serie5")) R.newBadges = (R.newBadges||[]).concat("serie5");
    if(R.streak >= 10 && grant("serie10")) R.newBadges = (R.newBadges||[]).concat("serie10");
  } else {
    R.streak = 0; xp = res.earned > 0 ? 4 : 0;
  }
  const total = xp + bonus;
  R.xp += total;
  R.answers[q.id] = Object.assign(res, {xp, bonus, streakAt: R.streak, praise: res.correct ? pick(PRAISE) : pick(OOPS)});
  R.sel = null; R.phase = null; R.rub = null;
  if(R.maxStreak > (S.profile.bestStreak||0)) S.profile.bestStreak = R.maxStreak;
  persistRun();
  if(total) addXp(total);
  renderRun();
  const fbEl = $("#fb");
  if(res.correct || (q.type === "open" && res.earned === q.pts)){ tone("ok"); const b = $("#qact .btn"); if(total) floatXp("+" + total + " XP", b); if(R.streak >= 3 || q.type === "open") { const r = (b||document.body).getBoundingClientRect(); confetti(R.streak >= 5 ? 70 : 36, r.left + r.width/2, r.top); } }
  else if(!res.correct){ tone(res.earned > 0 ? "ok" : "bad"); }
  if(fbEl) fbEl.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"});
}
function nextQ(){
  const R = S.run;
  const n = R.order.length;
  for(let k=1;k<=n;k++){ const j = (R.idx + k) % n; if(!R.answers[R.order[j]]){ R.idx = j; persistRun(); window.scrollTo({top:0}); renderRun(); return; } }
  finishRun();
}
function finishRun(){
  const R = S.run; clearInterval(tick);
  const qs = R.order.map(id => QIDX[id].q);
  const total = qs.reduce((s,q) => s + q.pts, 0);
  const earned = qs.reduce((s,q) => s + (R.answers[q.id] ? R.answers[q.id].earned : 0), 0);
  const nota = Math.round((1 + 9 * earned / total) * 100) / 100;
  const autoQs = qs.filter(q => q.type !== "open");
  const correctN = autoQs.filter(q => R.answers[q.id] && R.answers[q.id].correct).length;
  const topics = {};
  qs.forEach(q => { const t = topics[q.topic] = topics[q.topic] || {e:0,p:0,n:0,c:0}; t.p += q.pts; t.n++; const a = R.answers[q.id]; if(a){ t.e += a.earned; if(a.correct) t.c++; } });
  let bonus = 0;
  if(R.mode === "test" || R.mode === "mix"){ bonus = nota >= 9 ? 50 : nota >= 7 ? 25 : 0; }
  const nb = (R.newBadges || []).slice();
  const g = id => { if(grant(id)) nb.push(id); };
  g("primul");
  if((R.mode === "test" || R.mode === "mix") && nota >= 9.5) g("nota10");
  if(R.mode === "fulger" && correctN === 10) g("fulger");
  const allOk = arr => arr.length && arr.every(q => R.answers[q.id] && R.answers[q.id].correct);
  const verbQs = autoQs.filter(q => q.topic === "verb"); if(verbQs.length >= 3 && allOk(verbQs)) g("verb");
  const poetQs = autoQs.filter(q => q.topic === "liric" || q.topic === "figuri"); if(poetQs.length >= 4 && allOk(poetQs)) g("poet");
  const synQs = autoQs.filter(q => q.topic === "sintaxa" || q.topic === "fraza");
  if(synQs.length >= 5 && synQs.filter(q => R.answers[q.id] && R.answers[q.id].correct).length / synQs.length >= .8) g("detectiv");
  const att = {id:R.id, mode:R.mode, tid:R.tid, ref:R.ref, title:R.title, date:Date.now(), startedAt:R.startedAt, duration:Math.round((Date.now()-R.startedAt)/1000), total, earned, nota, correctN, autoN:autoQs.length, xp:R.xp + bonus, bonus, maxStreak:R.maxStreak, topics, newBadges:nb,
    answers: R.order.map(id => { const a = R.answers[id]; return {id, given: a ? a.given : null, correct: a ? a.correct : false, earned: a ? a.earned : 0, skipped: !a}; })};
  saveAttempt(att);
  const done4 = TESTS.every(t => S.attempts.some(x => x.mode === "test" && x.tid === t.id));
  if(done4){ if(grant("maraton")) nb.push("maraton"); if(TESTS.every(t => (bestOf(t.id)||0) >= 7) && grant("campion")) nb.push("campion"); }
  att.newBadges = nb; saveAttempt(att);
  if(bonus) addXp(bonus);
  S.run = null; LS.del("ro-run");
  renderResult(att, true);
}

function answerText(q, g){
  if(g == null) return "—";
  if(q.type === "mc") return q.options[g] ?? "—";
  if(q.type === "tf") return g ? "Adevărat" : "Fals";
  if(q.type === "multi") return (g||[]).map(i => q.options[i]).join("; ") || "—";
  return String(g) || "—";
}
function correctText(q){
  if(q.type === "mc") return q.options[q.answer];
  if(q.type === "tf") return q.answer ? "Adevărat" : "Fals";
  if(q.type === "multi") return q.answer.map(i => q.options[i]).join("; ");
  if(q.type === "fill") return q.accept.find(x => /[ăâîșț]/.test(x)) || q.accept[0];
  return "vezi modelul";
}
function chartSvg(list){
  if(list.length < 2) return `<p class="empty">Graficul apare după cel puțin două teste.</p>`;
  const W = 560, H = 200, pl = 34, pr = 14, pt = 14, pb = 26;
  const xs = i => pl + i * (W - pl - pr) / (list.length - 1);
  const ys = v => pt + (10 - v) / 9 * (H - pt - pb);
  const pts = list.map((a,i) => [xs(i), ys(a.nota)]);
  const line = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${ys(1)} L${pts[0][0].toFixed(1)} ${ys(1)} Z`;
  const grid = [1,4,7,10].map(v => `<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`).join("");
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evoluția notelor">${grid}<path d="${area}" fill="var(--gram)" opacity=".10"/><path d="${line}" fill="none" stroke="var(--gram)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--paper)" stroke="var(--gram)" stroke-width="2"/>`).join("")}<circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--gram)"/><text x="${Math.min(last[0], W-pr-4)}" y="${last[1]-12}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${fmtNota(list[list.length-1].nota)}</text></svg>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(e.target.id === "modal"){ closeModal(); return; }
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const R = S.run;
  switch(act){
    case "read":
      if(!S.profile.read[id]){ S.profile.read[id] = Date.now(); addXp(20); floatXp("+20 XP", el); tone("ok");
        if(Object.keys(CHAPTERS).every(k => S.profile.read[k]) && grant("soarece")){ toast("Insignă nouă: Șoarece de bibliotecă!"); confetti(120); } }
      saveProfile(); route(); break;
    case "unread": delete S.profile.read[id]; saveProfile(); route(); break;
    case "practice": startRun("practice", id); break;
    case "start": startRun("test", id); break;
    case "fulger": startRun("fulger"); break;
    case "mix": startRun("mix"); break;
    case "resume": S.run.active = true; S.run.deadline = S.run.pausedLeft != null ? Date.now() + S.run.pausedLeft : S.run.deadline; S.run.pausedLeft = null; persistRun(); renderRun(); break;
    case "drop": S.run = null; LS.del("ro-run"); renderTests(); break;
    case "exit":
      $("#exitbar").innerHTML = `<div class="confirm"><span>Ieși din test? Progresul rămâne salvat și poți continua din pagina Teste EN (timpul se oprește).</span><button class="btn sm" data-act="pause">Da, ies</button><button class="btn ghost sm" data-act="finishnow">Termin acum și văd nota</button><button class="btn ghost sm" data-act="stay">Rămân</button></div>`; break;
    case "stay": $("#exitbar").innerHTML = ""; break;
    case "pause": R.active = false; R.pausedLeft = R.deadline ? R.deadline - Date.now() : null; persistRun(); clearInterval(tick); location.hash = "teste"; route(); break;
    case "finishnow": finishRun(); break;
    case "tab": R.textTab = id; persistRun(); renderRun(); break;
    case "toggletext": { const tp = $("#textpane"); tp.classList.toggle("open"); el.textContent = tp.classList.contains("open") ? "Ascunde textul" : "Arată textul"; break; }
    case "sel": { const q = curQ().q; R.sel = q.type === "tf" ? el.dataset.v === "true" : +el.dataset.i; $("#qbody").innerHTML = qBody(q); $("#qact").innerHTML = actions(q); break; }
    case "msel": { const q = curQ().q; const i = +el.dataset.i; R.sel = Array.isArray(R.sel) ? R.sel : []; R.sel = R.sel.includes(i) ? R.sel.filter(x => x !== i) : R.sel.concat(i); $("#qbody").innerHTML = qBody(q); $("#qact").innerHTML = actions(q); break; }
    case "check": { const q = curQ().q; if(q.type === "fill" && !(($("#fillin")||{}).value||"").trim()){ $("#fillin").focus(); return; } commitAnswer(q, grade(q), el); break; }
    case "model": { const q = curQ().q; R.draft = R.draft || {}; R.draft[q.id] = ($("#openin")||{}).value || ""; R.phase = "rubric"; R.rub = []; persistRun(); $("#qbody").innerHTML = qBody(q); $("#qact").innerHTML = actions(q); break; }
    case "rubok": { const q = curQ().q; const earned = (R.rub||[]).reduce((s,i) => s + q.rubric[i].p, 0); commitAnswer(q, {given: (R.draft||{})[q.id] || "", correct: earned === q.pts, earned}, el); break; }
    case "skip": { const q = curQ().q; R.skipped[q.id] = true; R.sel = null; R.order.splice(R.idx, 1); R.order.push(q.id); if(R.idx >= R.order.length) R.idx = 0; while(R.answers[R.order[R.idx]]) R.idx = (R.idx+1) % R.order.length; persistRun(); renderRun(); break; }
    case "next": nextQ(); break;
    case "lesson": openLesson(id); break;
    case "close": closeModal(); break;
    case "search": openSearch(); break;
    case "sugg": $("#sq").value = el.dataset.q; renderSearch(); $("#sq").focus(); break;
    case "sgo": goResult(+el.dataset.i); break;
    case "viewres": { e.preventDefault(); const a = S.attempts.find(x => x.id === id); if(a) renderResult(a, false); break; }
  }
});
document.addEventListener("change", e => {
  if(e.target.dataset && e.target.dataset.act === "rub"){
    const R = S.run, i = +e.target.dataset.i; R.rub = R.rub || [];
    R.rub = e.target.checked ? R.rub.concat(i) : R.rub.filter(x => x !== i);
    persistRun(); $("#qact").innerHTML = actions(curQ().q);
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "openin"){ const R = S.run; R.draft = R.draft || {}; R.draft[curQ().q.id] = e.target.value; $("#wc").textContent = wc(e.target.value) + " cuvinte"; persistRun(); }
  if(e.target.id === "fillin"){ S.run.sel = e.target.value; }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("#modal").hidden){ closeModal(); return; }
  if(e.key === "Enter" && e.target.id === "fillin"){ const b = $("#checkbtn"); if(b) b.click(); }
  if(S.run && S.run.active && $("#modal").hidden && !/INPUT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName)){
    const q = curQ().q; const a = S.run.answers[q.id];
    if(!a && (q.type === "mc" || q.type === "multi") && /^[a-d]$/.test(e.key)){ const pos = KEYS.indexOf(e.key); const i = ordOf(q)[pos]; if(i != null){ const b = document.querySelector(`[data-i="${i}"]`); if(b) b.click(); } }
    if(e.key === "Enter"){ const b = a ? document.querySelector('[data-act="next"]') : $("#checkbtn"); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
  }
});

/* ---------- search ---------- */
const SIDX = [];
(function buildIndex(){
  const tmp = document.createElement("div");
  Object.values(CHAPTERS).forEach(c => {
    tmp.innerHTML = c.body.replace(/<\/(td|th|li|p|div)>/g, " </$1>").replace(/<br\s*\/?>/g, " ");
    let sec = {n:0, head:"", text:[]};
    const push = () => { const t = sec.text.join(" ").replace(/\s+/g," ").trim(); if(t || sec.head) SIDX.push({c, n:sec.n, head:sec.head, text:t, nh:norm(sec.head), nt:norm(t), nc:norm(c.title)}); };
    let n = 0;
    Array.from(tmp.children).forEach(el => {
      if(el.tagName === "H4"){ push(); sec = {n:++n, head:el.textContent.trim(), text:[]}; }
      else sec.text.push(el.textContent);
    });
    push();
  });
})();
const SUGG = ["diftong","hiat","complement direct","supin","epitet","personificare","s-a sau sa","genitiv","rima","fabula","didascalii","predicat nominal","odată","paronime"];
function hlRe(words){
  const map = {a:"[aăâ]", i:"[iî]", s:"[sșş]", t:"[tțţ]"};
  const src = words.filter(Boolean).map(w => w.split("").map(ch => map[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("")).join("|");
  return src ? new RegExp("(?<![\\p{L}])(" + src + ")", "giu") : null;
}
function highlight(text, re){ return re ? esc(text).replace(re, "<mark>$1</mark>") : esc(text); }
function snippet(text, words){
  const nt = norm(text); let pos = -1;
  for(const w of words){ const p = nt.indexOf(w); if(p >= 0 && (pos < 0 || p < pos)) pos = p; }
  const start = Math.max(0, pos - 50);
  let s = text.slice(start, start + 170);
  return (start > 0 ? "… " : "") + s + (start + 170 < text.length ? " …" : "");
}
function doSearch(q){
  const words = norm(q).split(" ").filter(w => w.length >= 2);
  if(!words.length) return [];
  const res = [];
  SIDX.forEach(e => {
    const hay = e.nc + " " + e.nh + " " + e.nt;
    const rx = words.map(w => new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")));
    if(!rx.every(r => r.test(hay))) return;
    let score = 0;
    words.forEach(w => { if(e.nh.includes(w)) score += 6; if(e.nh.includes(words.join(" "))) score += 4; if(e.nc.includes(w)) score += 4; const m = (e.nt.match(new RegExp("\\b" + w, "g")) || []).length; score += Math.min(m, 5); });
    if(e.nt.includes(words.join(" "))) score += 5;
    res.push({e, score});
  });
  return res.sort((a,b) => b.score - a.score).slice(0, 12).map(r => r.e);
}
let sSel = 0, sRes = [];
function openSearch(q){
  const m = $("#modal");
  m.classList.add("top");
  m.innerHTML = `<div class="s-box" role="dialog" aria-modal="true" aria-label="Caută în teorie">
    <div class="s-in"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="sq" type="search" autocomplete="off" spellcheck="false" placeholder="Ce vrei să găsești? ex.: hiat, supin, epitet"><button class="btn ghost sm" data-act="close">Închide</button></div>
    <div class="s-list" id="slist"></div>
    <div class="s-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> alege</span><span><kbd>Enter</kbd> deschide</span><span><kbd>Esc</kbd> închide</span><span>Poți scrie și fără diacritice</span></div></div>`;
  m.hidden = false;
  const inp = $("#sq"); inp.value = q || ""; inp.focus(); renderSearch();
}
function renderSearch(){
  const q = $("#sq").value;
  const words = norm(q).split(" ").filter(w => w.length >= 2);
  sRes = doSearch(q); sSel = 0;
  const L = $("#slist");
  if(!words.length){
    L.innerHTML = `<div class="s-hint">Caută orice noțiune din teoria de gramatică și literatură. Încearcă:</div><div class="s-sugg">${SUGG.map(w => `<button data-act="sugg" data-q="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
    return;
  }
  if(!sRes.length){ L.innerHTML = `<div class="s-hint">Nu am găsit nimic pentru „${esc(q)}”. Încearcă un cuvânt mai scurt sau altă formă (ex.: „fabul” în loc de „fabulele”).</div>`; return; }
  const re = hlRe(words);
  L.innerHTML = sRes.map((e,i) => `<button class="s-item ${i===0?"on":""}" data-act="sgo" data-i="${i}">
    <div class="s-t"><span class="tag ${e.c.kind==="gram"?"g":"l"}">${e.c.kind==="gram"?"Gramatică":"Literatură"}</span>${highlight(e.c.title, re)}${e.head ? `<span class="sec">› ${highlight(e.head, re)}</span>` : ""}</div>
    <div class="s-x">${highlight(snippet(e.text || e.head, words), re)}</div></button>`).join("");
}
function markSel(){ document.querySelectorAll(".s-item").forEach((b,i) => b.classList.toggle("on", i === sSel)); const b = document.querySelectorAll(".s-item")[sSel]; if(b) b.scrollIntoView({block:"nearest"}); }
function goResult(i){
  const e = sRes[i]; if(!e) return;
  const target = e.n ? e.c.id + "-s" + e.n : null;
  const flash = () => { const el = target ? document.getElementById(target) : document.querySelector(".lesson h2"); if(el){ el.scrollIntoView({block:"center", behavior: reduce ? "auto" : "smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } };
  if(S.run && S.run.active){ $("#modal").classList.remove("top"); openLesson(e.c.id); setTimeout(flash, 50); return; }
  closeModal();
  if(location.hash === "#" + e.c.id){ route(); } else { location.hash = e.c.id; route(); }
  setTimeout(flash, 60);
}
document.addEventListener("input", e => { if(e.target.id === "sq") renderSearch(); });
document.addEventListener("keydown", e => {
  if(e.target.id === "sq"){
    if(e.key === "ArrowDown"){ e.preventDefault(); sSel = Math.min(sSel+1, sRes.length-1); markSel(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); sSel = Math.max(sSel-1, 0); markSel(); }
    else if(e.key === "Enter"){ e.preventDefault(); goResult(sSel); }
    return;
  }
  if((e.key === "/" || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))) && !/INPUT|TEXTAREA/.test(e.target.tagName) && $("#modal").hidden){ e.preventDefault(); openSearch(); }
}, true);
/* ---------- theme ---------- */
const HOST_THEME = document.documentElement.getAttribute("data-theme");
let THEME = LS.get("ro-theme", "light");
const TH_ICON = {
  light:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  dark:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  auto:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>'
};
const TH_LABEL = {light:"Fundal luminos", dark:"Fundal întunecat", auto:"Fundal automat (ca sistemul)"};
function applyTheme(){
  const root = document.documentElement;
  if(THEME === "auto"){ if(HOST_THEME) root.setAttribute("data-theme", HOST_THEME); else root.removeAttribute("data-theme"); }
  else if(root.getAttribute("data-theme") !== THEME) root.setAttribute("data-theme", THEME);
  const b = $("#theme"); if(b){ b.innerHTML = TH_ICON[THEME]; b.title = TH_LABEL[THEME] + " · apasă pentru a schimba"; }
}
try{ new MutationObserver(() => { if(THEME !== "auto" && document.documentElement.getAttribute("data-theme") !== THEME) applyTheme(); }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]}); }catch(e){}
$("#theme").addEventListener("click", () => { THEME = THEME === "light" ? "dark" : THEME === "dark" ? "auto" : "light"; LS.set("ro-theme", THEME); applyTheme(); toast(TH_LABEL[THEME]); });
applyTheme();
$("#sound").addEventListener("click", () => { S.sound = !S.sound; LS.set("ro-sound", S.sound); renderChip(); if(S.sound) tone("ok"); });
window.addEventListener("hashchange", () => { closeModal(); if(S.run && S.run.active){ const b = document.querySelector('[data-act="exit"]'); if(b) b.click(); return; } route(); window.scrollTo(0,0); });

/* ---------- boot ---------- */
if(S.run && S.run.active){ S.run.active = false; if(S.run.deadline){ S.run.pausedLeft = Math.max(0, S.run.deadline - Date.now()); } persistRun(); }
renderChip();
route();
initDb();
})();

</script>
